<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="/styles.css">
        <title>Tic Tac Toe</title>
        <style>
            .button {
                width: 200px;
                height: 200px;
                font-size: 25px;
                vertical-align: top;
            }
            #reset {
                width: 100px;
                height: 50px;
                font-size: 20px;
            }
            .content {
                flex: 1;
            }
        </style>
    </head>
    <body>
        <div class="content">
            <h1><a href="/"><img src="/favicon.ico" id="logo"></a> &nbsp; Tic Tac Toe</h1>
            <h3 id="turn">Turn: X</h3>
            <h3 id="winner"></h3>
            <button id="reset">Reset</button>
            <div class="board">
                <button id="btn1" class="button"></button>
                <button id="btn2" class="button"></button>
                <button id="btn3" class="button"></button>
                <br>
                <button id="btn4" class="button"></button>
                <button id="btn5" class="button"></button>
                <button id="btn6" class="button"></button>
                <br>
                <button id="btn7" class="button"></button>
                <button id="btn8" class="button"></button>
                <button id="btn9" class="button"></button>
            </div>
        </div>
        <script src="ttt.js"></script>
        <footer>
            <p>&copy; 2026 Overtankare</p>
            <p><a href="https://github.com/Overtankare/TechSketchbook">Github repo</a></p>
	    <p><a href="/LICENSE">License</a></p>
        </footer>
    </body>
</html>
